<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrar - Vegvisir</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body class="with-bg">
  <div class="bg-overlay"></div>
  <div class="container" style="max-width:520px;margin-top:40px">
    <div class="auth-card" style="position:relative">
      <button class="close-auth" aria-label="Cerrar" title="Cerrar" style="position:absolute;right:12px;top:10px;background:transparent;border:0;color:inherit;font-size:26px;line-height:1;cursor:pointer">×</button>
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label>Email o usuario
          <input id="userInput" placeholder="ej: alejandro@vegvisir.com o alejandro" required>
        </label>
        <label>Contraseña
          <input type="password" id="passInput" required>
        </label>
        <div style="text-align:right;margin-top:12px">
          <button class="btn" type="submit">Entrar</button>
        </div>
      </form>
      <p style="margin-top:14px">¿No tienes cuenta? <a href="signup.html">Regístrate</a></p>
    </div>
  </div>
  <script src="supabase-config.js"></script>
  <script src="scripts.js"></script>
  <script>
    // Close/hide the auth card when the user clicks the × button
    (function(){
      var btn = document.querySelector('.close-auth');
      if(!btn) return;
      btn.addEventListener('click', function(){
        var card = document.querySelector('.auth-card');
        if(card) card.style.display = 'none';
        // optional: navigate back to home
        // window.location.href = 'index.html';
      });
    })();
  </script>
</body>
</html>
